name: Stage author-reviewed v1.0.0 archives

on:
  push:
    branches: [maintenance/stage-approved-v1.0.0-20261103]
    paths: [.github/workflows/stage-approved-release.yml]

permissions:
  contents: read

jobs:
  stage:
    if: github.repository == 'sijunpeng123/Biotrack_Studio'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify approved archive bytes and source Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .release-staging/stage_approved_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: BioTrack_Studio_v1.0.0_reviewed_7148970
          compression-level: 0
          retention-days: 30
          path: |
            ${{ runner.temp }}/approved_biotrack_release/BioTrack_Studio_v1.0.0.zip
            ${{ runner.temp }}/approved_biotrack_release/BioTrack_Studio_v1.0.0_GitHub_Source.zip
            ${{ runner.temp }}/approved_biotrack_release/SHA256SUMS.txt
            ${{ runner.temp }}/approved_biotrack_release/staging_verification.json
