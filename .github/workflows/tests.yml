name: tests

on:
  push:
  pull_request:

jobs:
  consensus-unit-tests:
    env:
      QT_QPA_PLATFORM: ${{ matrix.os == 'macos-latest' && 'cocoa' || 'offscreen' }}
      PYTHONNOUSERSITE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install BioTrack Studio and test dependencies
        run: python -m pip install -e . ruff==0.17.1
      - name: Check Python sources and generated launchers
        run: python .github/scripts/check_code.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
