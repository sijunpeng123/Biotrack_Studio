name: Verify published author-approved v1.0.0 release

on:
  push:
    branches: [maintenance/publish-approved-v1.0.0-20261103]
    paths: [.github/workflows/publish-approved-release.yml]

permissions:
  contents: read
  actions: read

jobs:
  publish:
    if: github.repository == 'sijunpeng123/Biotrack_Studio'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only verification of published release and retained backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .release-publishing/finalize_approved_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BioTrack_v1.0.0_final_publication_verification
          retention-days: 30
          path: ${{ runner.temp }}/biotrack_publication_records/*.json
